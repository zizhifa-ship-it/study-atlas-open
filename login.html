<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#214d3d">
  <meta name="robots" content="noindex,nofollow">
  <title>Study Atlas · 局域网登录</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light; --green:#214d3d; --ink:#283d34; --muted:#748176; --line:#dde4d7; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:#eef1e9; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    .card { width:min(430px,100%); background:#fff; border:1px solid var(--line); border-radius:20px; padding:30px; box-shadow:0 20px 70px #1d30291a; }
    .brand { display:flex; gap:12px; align-items:center; font-size:21px; font-weight:700; letter-spacing:.5px; }
    .brand img { width:42px; height:42px; }
    .brand small { display:block; margin-top:4px; color:var(--muted); font-size:10px; letter-spacing:1.5px; font-weight:500; }
    h1 { font-size:24px; line-height:1.5; margin:28px 0 10px; }
    p { margin:0; color:var(--muted); font-size:13px; line-height:1.9; }
    code { background:#f0f4e9; border-radius:5px; padding:2px 5px; color:#4d6b4a; overflow-wrap:anywhere; }
    label { display:block; margin:24px 0 8px; font-size:12px; font-weight:600; color:#536a4c; }
    input { width:100%; padding:13px 14px; border:1px solid var(--line); border-radius:10px; background:#fbfcf8; color:var(--ink); font-size:17px; letter-spacing:1px; }
    button { width:100%; margin-top:14px; padding:13px; border:0; border-radius:10px; background:var(--green); color:#fff; font-size:14px; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; }
    .status { min-height:24px; margin-top:14px; font-size:12px; line-height:1.8; color:#a15f4b; }
    .note { margin-top:22px; padding-top:18px; border-top:1px solid #edf0e7; font-size:11px; line-height:1.9; }
    .steps { margin:8px 0 0; padding-left:20px; color:var(--muted); font-size:12px; line-height:2; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><img src="/favicon.svg" alt=""><span>学习图谱<small>STUDY ATLAS · LAN</small></span></div>
    <h1>局域网登录</h1>
    <p>这台 Study Atlas 正以局域网模式运行。请在启动它的 Mac 上打开 <code>.local/lan-code.txt</code>，输入其中的登录码。</p>
    <form id="login-form">
      <label for="code">登录码</label>
      <input id="code" name="code" autocomplete="one-time-code" autocapitalize="off" spellcheck="false" required autofocus placeholder="输入登录码">
      <button type="submit">进入我的知识库</button>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </form>
    <div class="note">
      <strong>安全边界</strong>
      <ol class="steps">
        <li>只在你信任的局域网使用；不要在公共 Wi-Fi 或公网端口转发。</li>
        <li>登录码在每次重启后更新，iPad 的登录会话可保留 30 天。</li>
        <li>需要从外网使用时，建议用 Tailscale 等私有网络，而不是开放公网。</li>
      </ol>
    </div>
  </main>
  <script src="/login.js"></script>
</body>
</html>
