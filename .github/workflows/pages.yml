name: Publish browser app
on:
  push:
    branches: [main]
    paths: ['browser/**', 'tools/build_browser_site.py', 'cornell.js', 'knowledge.js', 'memory-cards.js', 'styles.css', 'favicon.svg', 'LICENSE', 'tests/browser_static.mjs', 'tests/note-jobs.test.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-pages
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/browser-direct.test.mjs tests/note-jobs.test.mjs
      - run: python tools/build_browser_site.py
      - name: Install isolated browser test dependencies
        run: |
          python -m pip install reportlab
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Verify PDF import, saved notes and recovery on iPad layout
        env:
          STUDY_ATLAS_STATIC_DIR: ${{ github.workspace }}/_site-browser
        run: node tests/browser_static.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site-browser
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static browser app
        id: deployment
        uses: actions/deploy-pages@v4
